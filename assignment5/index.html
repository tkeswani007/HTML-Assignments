 <style>
            *{

            .con{

            }
            .circle{

            }
            .icon{
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            gap: 20px;

            .fa-facebook{

            }
            .fa-instagram{

            }

            }
            .fa-linkedin{

            }
