<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(90deg, skyblue, purple);

        }
        form{
            height: 80%;
            border-radius: 10px;
            width: 30%;
            background-color: white;
        }
        .email, .password, .login {
            height: 22.5%;
            width: 90%;
            margin: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        input{
            border: 1px solid gray;
            background-color: lightgray;
            border-radius: 10px;
            height: 40%;
            width: 100%;
            margin-top: 3%;
            text-align: center;
        }
        h1{
            margin-top: 10%;
            margin-bottom: 5%;
        }
        .login>p{
            margin-top: 5%;
            text-align: center;
        }
        .password>p{
            margin-top: 3%;
            color: gray;
            font-style: italic;
        }
        #login{
            background: linear-gradient(90deg, skyblue, purple);
            color: white;
        }
        a{
            color: blue;
            text-decoration: none;
            font-style: italic;
        }
    </style>
</head>
<body>
    <form action="">
        <h1 align = "center">Login Form</h1>
        <div class="email">
            <label for="">Email or Phone</label>
            <input type="text" placeholder="xyz@gmail.com">
        </div>
        <div class="password">
            <label for="">Password</label>
            <input type="password" placeholder="abc@11324">
            <p>Forgot password?</p>
        </div>
        <div class="login">
            <input type="submit" value="Login" id="login">
            <p>Not a member? <a href="C:\Users\DeLL\OneDrive\bca\bca 3rd sem\tarun keswani web programming\assignment10\signup\index.html">Sign up</a></p>
        </div>

    </form>
</body>
</html>
